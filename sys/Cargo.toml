[package]
name = "sys"
version.workspace = true
edition.workspace = true

[features]
# Optional: embed libsecp256k1 precomputed tables (~1MB in the binary) so the
# first sign/verify has no init cost. Workspace members leave this off — native
# binaries and the SDK both compute the tables once on first use (`OnceLock`).
# Enabling it from any crate in a build unifies onto `sys` and bloats every
# linked binary (workers share the `app`/`mint` graph with fullnode).
secp-static-context = ["libsecp256k1/static-context"]

[dependencies]
sha3 = "0.10"
sha2 = "0.10"
ripemd = "0.1"
base58check = "0.1"
libsecp256k1 = { version = "0.7.2", features = ["hmac"], default-features = false }
base64 = "0.22"
hex = "0.4"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
