[package]
name = "sys"
version.workspace = true
edition.workspace = true

[features]
# 内嵌 libsecp256k1 预计算表（~1MB 数据段）：全节点（mint/app 等）启用，
# 首次签名/验签零初始化开销。SDK（wasm/codec-only 构建）不启用，表改为
# 首次使用时运行时计算，避免 ~1MB 预计算表进入 wasm。
# 注意：feature 合并在构建图内取并集，必须只在全节点专属 crate 启用。
secp-static-context = ["libsecp256k1/static-context"]

[dependencies]
sha3 = "0.10"
sha2 = "0.10"
ripemd = "0.1"
base58check = "0.1"
libsecp256k1 = { version = "0.7.2", features = ["hmac"], default-features = false }
base64 = "0.22"
hex = "0.4"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
serde = { version = "1", features = ["derive"] }
