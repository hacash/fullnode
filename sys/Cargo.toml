[package]
name = "sys"
version.workspace = true
edition.workspace = true

[features]
# Embed libsecp256k1 precomputed tables (~1MB data segment): enabled by full nodes (mint/app etc.),
# so the first sign/verify has zero initialization cost. SDK (wasm/codec-only builds) does not enable
# it; the tables are computed at runtime on first use to keep ~1MB of precomputed tables out of wasm.
# Note: feature union within the build graph means this must only be enabled by full-node crates.
secp-static-context = ["libsecp256k1/static-context"]

[dependencies]
sha3 = "0.10"
sha2 = "0.10"
ripemd = "0.1"
base58check = "0.1"
libsecp256k1 = { version = "0.7.2", features = ["hmac"], default-features = false }
base64 = "0.22"
hex = "0.4"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
