[package]
name = "base"
version.workspace = true
edition.workspace = true

#
[features]
# `execute` gates execution modules (`ActionDispatcher`, chain/store/chunk/
# ledger/node/api/sync/scaner, `ActionExecute`/`TransactionExecute`).
# `ActionRef` / `TxRef` are always the wire view (`dyn Action` / `dyn
# TransactionSign`); full builds reach execute through `as_execute`. Off in
# SDK/wasm builds so execution bodies never enter the wasm graph. Default on:
# only SDK/wasm consumers (including SDK codegen and
# protocol/vm/mint-core under their execute-off edges) disable it via
# `default-features = false`.
default = ["execute"]
# Gates execution modules only; previously also pulled `serde` for the config
# types, which are now decoded hand-written (no serde anywhere in base).
execute = []
[dependencies]
sys = { workspace = true }
field = { workspace = true }
action-derive = { workspace = true }
sha3 = "0.10"
