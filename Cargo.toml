[workspace]
resolver = "2"
members = [
    "sys",
    "field",
    "base",
    "action-codec-derive",
    "protocol",
    "vm",
    "mint",
    "mint-core",
    "chain",
    "codec-schema-gen",
    "chain-codec",
    "node",
    "server",
    "api",
    "app",
    "sdk",
    "db",
    "x16rs",
]

default-members = [
    "sys",
    "field",
    "base",
    "action-codec-derive",
    "protocol",
    "vm",
    "mint",
    "mint-core",
    "chain",
    "codec-schema-gen",
    "chain-codec",
    "node",
    "server",
    "api",
    "app",
    "sdk",
    "db",
    "x16rs",
]

[workspace.package]
version = "1.0.0"
edition = "2024"

[workspace.dependencies]
sys        = { path = "sys" }
field      = { path = "field", default-features = false }
base       = { path = "base" }
action-codec-derive = { path = "action-codec-derive" }
protocol   = { path = "protocol" }
vm         = { path = "vm" }
mint       = { path = "mint" }
mint-core = { path = "mint-core", default-features = false }
chain      = { path = "chain" }
chain-codec = { path = "chain-codec" }
node       = { path = "node" }
server     = { path = "server" }
api        = { path = "api" }
app        = { path = "app" }
sdk        = { path = "sdk" }
db         = { path = "db", default-features = false }
x16rs      = { path = "x16rs" }
serde      = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[profile.release]
debug = false
opt-level = 3
lto = true
codegen-units = 1
# Zero panic recovery in the codebase: a panic must terminate the process
# instead of continuing on unknown in-process state; the supervisor restarts
# from durable state (§9 of the state-read error contract).
panic = "abort"
strip = true

[profile.wasm-release]
inherits = "release"
opt-level = "z"

