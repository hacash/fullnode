[package]
name = "chain-codec"
version.workspace = true
edition.workspace = true

[dependencies]
sys = { workspace = true }
field = { workspace = true }
base = { path = "../base", default-features = false }
protocol = { path = "../protocol", default-features = false }
# Direct path (like the SDK): the workspace `vm` entry keeps its default
# `execute` feature for app/codec-schema-gen; the SDK/wasm build needs only the
# action codecs and disables the default here. The full node enables vm
# `execute` itself, and feature unification makes it take precedence.
vm = { path = "../vm", default-features = false }
mint-core = { workspace = true }
