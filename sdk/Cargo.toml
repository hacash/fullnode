[package]
name = "sdk"
# Mirrors `profile::SDK_VERSION` (the ABI-facing package version the
# sdk_version response reports); keep the two in lockstep.
version = "0.2.3"
edition.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
sys = { workspace = true }
field = { path = "../field", default-features = false }
base = { path = "../base", default-features = false }
hacash-params = { workspace = true }
protocol = { path = "../protocol", default-features = false }
vm = { path = "../vm", default-features = false }
mint-core = { workspace = true, default-features = false }
hex = "0.4.3"
wasm-bindgen = "=0.2.100"

# Tests only: the fitsh parser (Syntax/Tokenizer) lives behind vm's `syntax`
# feature, which the shipped wasm build keeps off to stay small.
[dev-dependencies]
vm = { path = "../vm", features = ["syntax"] }
