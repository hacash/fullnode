[package]
name = "sdk"
version = "0.2.0"
edition.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
sys = { workspace = true }
field = { path = "../field", default-features = false }
base = { path = "../base", default-features = false }
protocol = { path = "../protocol", default-features = false }
# Execute off (default-features = false): the wasm SDK only needs the action
# codecs; the VM execution engine is compiled but dead-code-eliminated from
# the wasm artifact (no codec-only feature anymore).
vm = { path = "../vm", default-features = false }
# mint-core inherits default-features = false from the workspace entry, so the
# consensus execute body (and its x16rs/num-bigint deps) stays out of wasm.
mint-core = { workspace = true }
chain-codec = { workspace = true }
hex = "0.4.3"
wasm-bindgen = "=0.2.100"
