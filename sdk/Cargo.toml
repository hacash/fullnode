[package]
name = "sdk"
version = "0.2.0"
edition.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
sys = { workspace = true }
field = { path = "../field", default-features = false }
base = { workspace = true }
protocol = { path = "../protocol", default-features = false, features = ["codec-only"] }
# codec-only: the wasm SDK only needs action codecs, dropping the VM executor/IR compiler (~28KB)
vm = { path = "../vm", default-features = false, features = ["codec-only"] }
# codec-only: symmetric with vm; explicitly take only the inscription action codecs (execute is off by default in the workspace)
mint-core = { workspace = true, features = ["codec-only"] }
chain-codec = { workspace = true }
hex = "0.4.3"
libsecp256k1 = { version = "0.7.2", features = ["hmac"], default-features = false }
wasm-bindgen = "=0.2.100"
