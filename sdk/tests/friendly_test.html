<!DOCTYPE html>
<head>
    <meta charset="utf-8">
    <title>Hacash WASM SDK smoke test</title>
</head>
<body>
    <h1>Hacash WASM SDK smoke test</h1>
    <pre id="output"></pre>
    <script type="module">
        import create_hacash_sdk from "../js/hacashsdk.mjs";

        const output = document.getElementById("output");
        const write = (value) => {
            output.textContent += `${String(value)}\n`;
        };

        try {
            // The web backend resolves ../web/hacashsdk.js from the facade
            // module URL; serve the dist directory statically.
            const sdk = await create_hacash_sdk();
            const caps = sdk.system.capabilities();
            write(`abi=${caps.abi.major}.${caps.abi.minor}`);
            const check = sdk.account.verify_address("1MzNY1oA3kfgYi75zquj3SRUPYztzXHzK9");
            write(`verify_address=${check.ok}`);
            const built = sdk.tx.build({
                tx_type: 2,
                main: "1MzNY1oA3kfgYi75zquj3SRUPYztzXHzK9",
                fee: "1:244",
                timestamp: 1755223764,
                actions: [
                    {
                        kind: "hac_transfer",
                        to: "1MzNY1oA3kfgYi75zquj3SRUPYztzXHzK9",
                        amount: "12:244",
                    },
                ],
            });
            write(`hash=${built.hash}`);
            write("OK");
        } catch (error) {
            write(error.message || error);
        }
    </script>
</body>
</html>
