[package]
name = "mint-core"
version.workspace = true
edition.workspace = true

[dependencies]
sys = { workspace = true }
field = { workspace = true }
base = { workspace = true }
# Used only by the execute body (BigUint for channel interest, x16rs mining/hex for diamond mint,
# protocol execution params/tx types); codec-only (SDK/wasm) builds never compile them
hex = { version = "0.4", optional = true }
num-bigint = { version = "0.4", optional = true }
protocol = { workspace = true, optional = true }
x16rs = { workspace = true, optional = true }

[features]
default = ["execute"]
# execute: full consensus execution body (enabled by fullnode/mint); when SDK (wasm) turns it off,
# the execute body compiles to nothing and the state-machine code it references no longer enters wasm
execute = ["dep:hex", "dep:num-bigint", "dep:protocol", "dep:x16rs"]
# codec-only: action (de)coding only (enabled by SDK/wasm). Equivalent to default-features=false;
# lets dependents explicitly declare "codec only, no execution body" (symmetric to vm::codec-only)
codec-only = []
