[package]
name = "mint-core"
version.workspace = true
edition.workspace = true

[dependencies]
sys = { workspace = true }
field = { workspace = true }
base = { path = "../base", default-features = false }
hacash-params = { workspace = true }
# Used only by the execute body (x16rs mining/hex for diamond mint, Hacash
# parameter profile). Policy: wasm SDK builds keep execute off so x16rs never
# enters the wasm graph (binary size) — enforced by a compile_error in
# src/lib.rs for wasm32+execute.
hex = { version = "0.4", optional = true }
x16rs = { workspace = true, optional = true }

[features]
default = ["execute"]
# execute: full consensus execution body (enabled by fullnode/mint); when SDK (wasm) turns it off,
# the execute body compiles to nothing and the state-machine code it references no longer enters wasm
execute = ["dep:hex", "dep:x16rs", "base/execute"]
[dev-dependencies]
# BigUint oracle for the channel-interest equivalence test (interest.rs): a
# dev-dependency, so it never enters the SDK/wasm graph
num-bigint = "0.4"
