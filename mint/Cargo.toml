[package]
name = "mint"
version.workspace = true
edition.workspace = true

[dependencies]
sys = { workspace = true, features = ["secp-static-context"] }
field = { workspace = true }
base = { workspace = true }
hacash-params = { workspace = true }
protocol = { workspace = true }
x16rs = { workspace = true }
mint-core = { workspace = true, features = ["execute"] }
num-bigint = "0.4"
num-traits = "0.2"
hex = "0.4"
ocl = { version = "0.19.7", optional = true }

[features]
ocl = ["dep:ocl"]

[dev-dependencies]
# Test oracle only (serde_json::Value assertions on the hand-written JSON
# output of the API layer): never enters the production dependency graph.
serde_json = "1"
