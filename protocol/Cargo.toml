[package]
name = "protocol"
version.workspace = true
edition.workspace = true

#
[features]
# `execute` is the shared "execution enabled" flag consumed by
# `base::impl_action!` and by the type-level ActionRef/TxRef cut (the execute
# view compiles only when this feature is on). Default on: only SDK/wasm and
# chain-codec consumers disable it via default-features = false.
default = ["execute"]
execute = ["base/execute"]

[dependencies]
sys = { workspace = true }
field = { workspace = true }
base = { path = "../base", default-features = false }
hex = "0.4"
