[package]
name = "protocol"
version.workspace = true
edition.workspace = true

#
[features]
# `execute` compiles `protocol::exec` (action/tx execute bodies via
# `impl_action_execute!` / `TransactionExecute`). Codec files only describe
# wire. `ActionRef`/`TxRef` stay the wire view in every build.
# Default on: only SDK/wasm consumers disable it via
# default-features = false.
default = ["execute"]
execute = ["base/execute"]

[dependencies]
sys = { workspace = true }
field = { workspace = true }
base = { path = "../base", default-features = false }
hacash-params = { workspace = true }
hex = "0.4"
