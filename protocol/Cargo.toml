[package]
name = "protocol"
version.workspace = true
edition.workspace = true

#
[features]
# `execute` is the shared "execution enabled" flag consumed by
# `base::impl_action!` (it expands to a stub whenever this feature is off).
# Default on: only codec-only consumers (SDK/wasm, chain-codec) disable it.
default = ["execute"]
execute = []
# Action codec only (used by SDK/wasm), a marker kept for manifest symmetry
# with vm/mint-core: every standard action's execute compiles into an entry
# stub that returns an error (only fails, never silently succeeds). What
# actually switches the stubs on is `execute` being off.
codec-only = []

[dependencies]
sys = { workspace = true }
field = { workspace = true }
base = { workspace = true }
