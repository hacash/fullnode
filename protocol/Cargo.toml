[package]
name = "protocol"
version.workspace = true
edition.workspace = true

#
[features]
# 仅动作编解码（SDK/wasm 使用）：所有标准 action 的 execute 编译为返回
# 错误的入口桩（只失败、绝不静默成功）。与 vm/mint-core 的 codec-only 对称；
# 必须与 target_arch = "wasm32" 搭配使用（见源码 cfg），native 构建即使启用
# 该 feature 也保持完整执行实现。
codec-only = []

[dependencies]
sys = { workspace = true }
field = { workspace = true }
base = { workspace = true }
