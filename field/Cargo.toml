[package]
name = "field"
version.workspace = true
edition.workspace = true

#
[features]
default = []
# Amount's big-integer path is the single base-256 byte-array core
# (types/amount_base256.rs). num-bigint is not a production dependency: it
# stays as a dev-dependency test oracle that cross-checks the base-256 core
# against the reference implementation (drift guard).
# The JSON parsing engine is the single hand-written implementation
# (src/json.rs) in every build — SDK/wasm and fullnode alike. serde_json
# survives only as a dev-dependency test oracle: the engine_equivalence
# tests and the differential fuzz prove the hand-written engine is strictly
# equivalent to serde_json on the shared contract. No feature selection, so
# there is no workspace feature-unification hazard for wasm artifacts.

[dependencies]
sys = { workspace = true }
base64 = "0.22"
hex = "0.4"
base58check = "0.1"

[dev-dependencies]
# Test oracle only: under cfg(test), json.rs compiles the serde_json engine
# alongside the handwritten one for the engine_equivalence comparison tests
# and the differential fuzz. Never enters a production or wasm compile graph.
serde = { workspace = true }
serde_json = { workspace = true, features = ["raw_value"] }
# BigUint/BigInt oracle for the amount equivalence tests (cfg(test) in
# amount.rs / amount_base256.rs): as dev-dependencies they do not enter any
# production or wasm compile graph
num-bigint = "0.4"
num-traits = "0.2"
