[package]
name = "vm"
version.workspace = true
edition.workspace = true

#
[features]
# `execute` is the shared "execution enabled" flag consumed by `base::impl_action!`
# (the execute impl compiles only when this feature is on). Off under SDK/wasm
# builds (default-features = false), on by default for full nodes.
# The VM codec/wire surface is unconditional; the execution engine (IR compiler,
# machine, state, api, FitSH entry) is always compiled and dead-code-eliminated
# from the SDK/wasm artifact, so the `full`/`codec-only` split no longer exists.
default = ["execute"]
execute = ["base/execute"]

[dependencies]
sys = { workspace = true }
field = { workspace = true }
base = { path = "../base", default-features = false }
hex = "0.4"
serde_json = "1.0"
dyn-clone = "1.0"
ripemd = "0.1"
sha2 = "0.10"
sha3 = "0.10"
blake2 = "0.10"
tiny-keccak = { version = "2.0", features = ["keccak"] }
