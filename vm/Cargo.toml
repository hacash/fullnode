[package]
name = "vm"
version.workspace = true
edition.workspace = true

#
[features]
# `execute` compiles the IR/machine engine (`ir`/`interpreter`/`frame`/
# `native`/`space`/`state`/`setup`), `api`/`fitshc`, and action execute
# bodies. Codec files (`action`/`contract`/`rt` wire types/`value`) stay
# on without it. Off under SDK/wasm via default-features = false.
default = ["execute"]
execute = [
    "base/execute",
    "dep:dyn-clone",
    "dep:sha2",
    "dep:blake2",
    "dep:tiny-keccak",
]
[dependencies]
sys = { workspace = true }
field = { workspace = true }
base = { path = "../base", default-features = false }
hacash-params = { workspace = true }
hex = "0.4"
dyn-clone = { version = "1.0", optional = true }
ripemd = "0.1"
sha2 = { version = "0.10", optional = true }
sha3 = "0.10"
blake2 = { version = "0.10", optional = true }
tiny-keccak = { version = "2.0", features = ["keccak"], optional = true }
