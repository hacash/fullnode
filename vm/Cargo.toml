[package]
name = "vm"
version.workspace = true
edition.workspace = true

#
[features]
# `execute` compiles the machine engine (`interpreter`/`frame`/
# `native`/`space`/`state`/`setup`), `api`/`fitshc`, and action execute
# bodies. Codec files (`action`/`contract`/`rt` wire types/`value`), the IR
# node model (`ir`) and the fitsh decompiler (`lang`) stay on without it.
# Off under SDK/wasm via default-features = false.
default = ["execute", "calc-aot"]
execute = [
    "base/execute",
    "dep:sha2",
    "dep:blake2",
    "dep:tiny-keccak",
    "dep:p256",
    "syntax",
]
# FitSH source-level compilation front-end: tokenizer, `Syntax` parser,
# const literals, IR serialize/codegen and the `lang_to_*` builders. Depends
# only on codec-side types (+ `sys` hashing for `calc_func_sign`), so a
# codec-only consumer (SDK wasm) may opt in without the execution engine.
syntax = []
# AOT translation backend (`calc::aot`). On by default for official x86-64
# nodes: each calc call runs the interpreter and then AOT in order on the
# calling thread and rejects the transaction if gas or the result disagree. This is the early
# lockstep check; once that check has stayed quiet, the interpreter is
# retired and AOT is the only engine. Other platforms turn the feature off
# (`--no-default-features --features execute`) and run the interpreter
# alone. Enabling it off x86-64 is a compile_error. The wasm SDK already
# depends on vm with default-features = false.
# Suite: cargo test -p vm --features calc-aot
calc-aot = ["dep:libc"]
# Test-only calc config: `testkit` (both host knobs on, memory cap above
# the v1 64 KiB, hard-capped at 16 MiB) and the test/testkit-gated
# `CalcFnObj::build` helpers. Absent from production builds.
# Integration tests pick it up from the dev-dependency below.
# Arch-test: cargo test -p vm --features calc-testkit --test calc_archtest
calc-testkit = []

[[test]]
name = "calc_archtest"
required-features = ["calc-testkit"]
[dev-dependencies]
# Enables `calc-testkit` for this package's own tests (integration tests do
# not see `cfg(test)` on the library). Not a normal dependency.
vm = { path = ".", features = ["calc-testkit"] }
# Differential-testing oracles for the calc interpreter (never runtime deps).
# ckb-vm: full-program differential engine (memory ops, MULH family; see
#   tests/calc_differential.rs).
ckb-vm = "=0.24.13"
# softcore-rv64: instruction-level golden oracle, automated Rust translation of
#   the official Sail RISC-V executable spec. Instruction-subset only: MULH/
#   MULHU/MULHSU panic on a prelude 128-bit bug, LOAD/STORE are todo!().
#   Version is hard-pinned: the oracle itself is part of the pinning-test
#   fixture set.
softcore-rv64 = "=0.6.0"

[dependencies]
libc = { version = "0.2", optional = true }
sys = { workspace = true }
field = { workspace = true }
base = { path = "../base", default-features = false }
hex = "0.4"
dyn-clone = "1.0"
ripemd = "0.1"
sha2 = { version = "0.10", optional = true }
sha3 = "0.10"
blake2 = { version = "0.10", optional = true }
tiny-keccak = { version = "2.0", features = ["keccak"], optional = true }
p256 = { version = "0.13", features = ["ecdsa"], optional = true }
