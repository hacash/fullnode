[package]
name = "vm"
version.workspace = true
edition.workspace = true

#
[features]
# `execute` compiles the machine engine (`interpreter`/`frame`/
# `native`/`space`/`state`/`setup`), `api`/`fitshc`, and action execute
# bodies. Codec files (`action`/`contract`/`rt` wire types/`value`), the IR
# node model (`ir`) and the fitsh decompiler (`lang`) stay on without it.
# Off under SDK/wasm via default-features = false.
default = ["execute"]
execute = [
    "base/execute",
    "dep:sha2",
    "dep:blake2",
    "dep:tiny-keccak",
    "dep:p256",
    "syntax",
]
# FitSH source-level compilation front-end: tokenizer, `Syntax` parser,
# const literals, IR serialize/codegen and the `lang_to_*` builders. Depends
# only on codec-side types (+ `sys` hashing for `calc_func_sign`), so a
# codec-only consumer (SDK wasm) may opt in without the execution engine.
syntax = []
# AOT translation backend (`calc::aot`) — benchmark/differential-testing
# infrastructure only, never part of consensus builds. Disabled by default so
# plain builds (and wasm SDK targets, which have no mmap) never compile it.
# Run its suite with: cargo test -p vm --features calc-aot
calc-aot = ["dep:libc"]
[dev-dependencies]
# Differential-testing oracles for the calc interpreter (never runtime deps).
# ckb-vm: full-program differential engine (memory ops, MULH family, and all
#   compressed forms execute here; see tests/calc_differential.rs).
ckb-vm = "=0.24.13"
# softcore-rv64: instruction-level golden oracle, automated Rust translation of
#   the official Sail RISC-V executable spec. Instruction-subset only: MULH/
#   MULHU/MULHSU panic on a prelude 128-bit bug, LOAD/STORE are todo!(), and
#   its public decoder never emits C_* asts (we hand-build them from our own
#   decoder for execute-side pinning). Version is hard-pinned: the oracle
#   itself is part of the pinning-test fixture set.
softcore-rv64 = "=0.6.0"

[dependencies]
libc = { version = "0.2", optional = true }
sys = { workspace = true }
field = { workspace = true }
base = { path = "../base", default-features = false }
hex = "0.4"
dyn-clone = "1.0"
ripemd = "0.1"
sha2 = { version = "0.10", optional = true }
sha3 = "0.10"
blake2 = { version = "0.10", optional = true }
tiny-keccak = { version = "2.0", features = ["keccak"], optional = true }
p256 = { version = "0.13", features = ["ecdsa"], optional = true }
